<!doctype html>
<!-- The lang placeholder is filled per request in hooks.server.ts: "es" under /es, else "en". -->
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width" />
    <!-- Adobe Fonts, the fleet's shared kit noj4tji: Pragmatica + Pragmatica
         Extended (every cut, Light included — the licensed stand-in for the
         comps' Helvetica Neue) and Area Normal for buttons. The site started on
         kit alh8out because noj4tji had no pragmatica-extended; all of
         Pragmatica was added to the shared project on 2026-09-02.

         Loaded as a plain stylesheet on purpose. The fleet's usual trick —
         media="print" plus onload="this.media='all'" — is an inline event
         handler, and this site's CSP grants script-src nonces without
         'unsafe-inline'. A nonce never authorises an inline handler, so that
         swap would be blocked and the media attribute would stay "print":
         fonts fetched, never applied, no console error on the happy path. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/noj4tji.css" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- display:contents wrapper per SvelteKit's recommendation: placing the app
         directly inside <body> can break when browser extensions inject nodes. -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
