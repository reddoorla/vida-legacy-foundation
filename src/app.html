<!doctype html>
<!-- The lang placeholder is filled per request in hooks.server.ts: "es" under /es, else "en". -->
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width" />
    <!-- Adobe Fonts, the fleet's shared kit noj4tji: Pragmatica + Pragmatica
         Extended (every cut, Light included — the licensed stand-in for the
         comps' Helvetica Neue) and Area Normal for buttons. The site started on
         kit alh8out because noj4tji had no pragmatica-extended; all of
         Pragmatica was added to the shared project on 2026-09-02.

         Loaded as a plain stylesheet on purpose. The fleet's usual trick —
         media="print" plus onload="this.media='all'" — is an inline event
         handler, and this site's CSP grants script-src nonces without
         'unsafe-inline'. A nonce never authorises an inline handler, so that
         swap would be blocked and the media attribute would stay "print":
         fonts fetched, never applied, no console error on the happy path. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/noj4tji.css" />
    <!-- Without scripts the bar's hamburger is inert: it announces a menu and
         does nothing, because NavMenu is not in the DOM until it is clicked.
         Nav always renders the entries as a `.nav-nojs` list, hidden by
         app.css, and this reveals them and hides the button that cannot work.

         Here rather than in the component: Svelte treats a <style> anywhere
         in a component as a style block and empties it out of the markup, and
         real elements inside a <noscript> would not survive hydration either
         (a browser running scripts parses that content as raw text). The rule
         is generic, so it does not need the entries. style-src grants
         'unsafe-inline'; this needs no nonce.

         The class is doubled deliberately: app.css's `.nav-nojs { display:
         none }` arrives with the app's own head markup, BELOW this block, so
         an equal specificity would lose on order. Doubling it wins wherever
         the two end up.

         Two things must never appear in a comment in this file, and both
         bit within an hour of each other:

         1. The head placeholder's own name. SvelteKit substitutes the FIRST
            occurrence and only the first, so a mention in prose takes the
            whole head, and the real one below is left to render literally.
         2. A comment terminator. The injected head markup carries Svelte's
            hydration markers, and one of them is a comment that ENDS — which
            ends this one too, spilling the rest of the sentence into the
            document as visible text and the head tags into the body. Writing
            the terminator here to explain that did it a second time.

         tests/smoke/pages.spec.ts fails on either now, and
         src/app-html.test.ts on the first. -->
    <noscript>
      <style>
        .nav-nojs.nav-nojs {
          display: flex;
        }
        [data-nav-toggle] {
          display: none;
        }
      </style>
    </noscript>
    <!-- The two runway stages, rendered as their FINAL frame when there is
         nothing to run them.

         HeartHero and PageMasthead are 260vh runways whose opening is driven
         by scroll progress that only a script computes. Without one the band
         is two and a half viewports of unchanging green, the photograph stays
         in its closed shape, and the page's only h1 sits at opacity 0 — on
         `/` and `/about` alike, which between them is every published page
         that has a masthead. The text is in the markup, so a crawler and a
         screen reader both get it; it is a sighted visitor who gets nothing.
         HeartHero's copy at least has a `:focus-within` hatch, because the
         block holds the two call-to-action links. PageMasthead's holds only a
         paragraph and a heading, so on Who We Are nothing can reveal it at
         all.

         These rules are the components' own reduced-motion block plus the
         open values its JavaScript half supplies, which is the same static
         frame the design already specifies for a visitor who does not want
         the animation.

         Every class is TRIPLED. Svelte scopes a component's rules with a hash
         class, so `.reveal` is really `.reveal.svelte-1abc` at (0,2,0), and
         those sheets arrive with the app's head markup BELOW this block: two
         classes here would tie and lose on order, one would lose outright.
         Three clears both without naming a hash, which changes every build.
         Same lever as the nav list above, one class further along. -->
    <noscript>
      <style>
        /* The band and its stage: the comp's shape, not a runway. */
        .heart-hero.heart-hero.heart-hero,
        .page-masthead.page-masthead.page-masthead {
          min-height: 0;
          aspect-ratio: 1440 / 860;
        }
        .heart-hero-stage.heart-hero-stage.heart-hero-stage,
        .page-masthead-stage.page-masthead-stage.page-masthead-stage {
          position: static;
          height: 100%;
        }
        /* The components' own reduced-motion breakpoint, to the pixel: these
           rules stand in for that block's geometry, so a width where the two
           disagreed would get half of each. (The px rule for `--nav-h` in
           app.css is about the nav bar, which is gated on a different query.)

           Written `max-width` rather than the components' `width < 48rem`
           range syntax on purpose. Safari only learned range syntax in 16.4
           and drops a whole block it cannot parse — which for THIS block would
           hand a phone the 1440/860 desktop band, a 233px letterbox with the
           heading positioned off it. The components degrade the same way on
           those versions, but they only lose the reduced-motion frame; this is
           the sole thing standing between a scriptless visitor and a readable
           page, so it is worth the less elegant form. */
        @media (max-width: 47.999rem) {
          .heart-hero.heart-hero.heart-hero,
          .page-masthead.page-masthead.page-masthead {
            aspect-ratio: auto;
            /* vh first: an engine with no small-viewport units drops the svh
               line and would otherwise be left with no height at all. */
            min-height: 100vh;
            min-height: 100svh;
          }
          .heart-hero-stage.heart-hero-stage.heart-hero-stage,
          .page-masthead-stage.page-masthead-stage.page-masthead-stage {
            height: 100vh;
            height: 100svh;
          }
        }
        /* The open heart, sized without measuring anything. The component
           sets the mask as a percentage of the stage's WIDTH, which it can
           only learn from a ResizeObserver. That same size is a fixed
           multiple of the stage's HEIGHT — HEART_END_HEIGHT_RATIO in
           HeartHero/heart.ts, 2352.03/860 — and a percentage in the height
           slot of mask-size resolves against the positioning area's height.
           So the second form needs no measurement and computes the identical
           heart at every aspect. heart.test.ts holds the two in step.
           mask-position's own fallback is already the open value; the inline
           attribute is what was overriding it. */
        .heart-mask.heart-mask.heart-mask {
          -webkit-mask-size: auto 273.4919%;
          mask-size: auto 273.4919%;
          -webkit-mask-position: center 50%;
          mask-position: center 50%;
        }
        /* PageMasthead's window is a clip-path whose insets are all scaled by
           --opened, set inline on the stage and inherited down. Setting it on
           the element that READS it wins by directness — an inherited value
           never beats one declared on the element itself — so this needs no
           specificity contest at all. */
        .masthead-window.masthead-window.masthead-window {
          --opened: 1;
        }
        /* The copy, the buttons, the scroll cue and the grain. .hero-bar is a
           transform rather than a .reveal, and has no hatch of its own. */
        .reveal.reveal.reveal {
          opacity: 1;
          transform: none;
        }
        .hero-bar.hero-bar.hero-bar {
          transform: none;
        }
        .texture-full.texture-full.texture-full {
          opacity: 1;
        }
      </style>
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- display:contents wrapper per SvelteKit's recommendation: placing the app
         directly inside <body> can break when browser extensions inject nodes. -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
